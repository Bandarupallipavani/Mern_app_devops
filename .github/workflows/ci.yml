name: build-and-lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Lint backend
        working-directory: server
        run: npm run lint -- --max-warnings=0

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Lint frontend
        working-directory: client
        run: npm run lint -- --max-warnings=0

      - name: Build backend image
        run: docker build -t backend ./server

      - name: Build frontend image
        run: |
          docker build -t frontend \
            --build-arg VITE_API_URL=https://pavani.vjstartup.com/be/api \
            ./client

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push backend to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker tag backend bandarupallypavani/mern-backend:latest
          docker push bandarupallypavani/mern-backend:latest

      - name: Push frontend to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker tag frontend bandarupallypavani/mern-frontend:latest
          docker push bandarupallypavani/mern-frontend:latest

  deploy:
    needs: build-and-lint
    if: github.event_name == 'push'
    runs-on: self-hosted        # ← CHANGED: uses YOUR server now

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --build
          docker image prune -f
          docker compose ps